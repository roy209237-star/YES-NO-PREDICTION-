version: '3.8'

services:
  # ===== WEB SERVER =====
  web:
    build: .
    container_name: yesno-pro-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@db:5432/yesno_pro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - redis
    restart: always
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ===== DATABASE =====
  db:
    image: postgres:15-alpine
    container_name: yesno-pro-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=yesno_pro
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema-optimized.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ===== REDIS CACHE =====
  redis:
    image: redis:7-alpine
    container_name: yesno-pro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ===== NGINX LOAD BALANCER =====
  nginx:
    image: nginx:alpine
    container_name: yesno-pro-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: always

  # ===== PROMETHEUS (Monitoring) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: yesno-pro-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  # ===== GRAFANA (Dashboards) =====
  grafana:
    image: grafana/grafana:latest
    container_name: yesno-pro-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: always

  # ===== ELASTICSEARCH (Logging) =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: yesno-pro-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: always

  # ===== KIBANA (Log Viewer) =====
  kibana:
    image: docker.elastic.co/kibana/kibana:8.0.0
    container_name: yesno-pro-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: always

  # ===== ADMINER (Database UI) =====
  adminer:
    image: adminer
    container_name: yesno-pro-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  default:
    name: yesno-pro-network
    driver: bridge
