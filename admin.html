<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — YES/NO Pro</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand">YES/NO <b>ADMIN</b></div><a href="/">← App</a></header><main class="view"><h1 style="font-size:45px;letter-spacing:-2px">Admin Dashboard</h1><p class="muted">Virtual-points event management.</p><div class="authbox"><h2>Create Market</h2><input id="title" placeholder="Market title"><input id="desc" placeholder="Description"><input id="close" type="datetime-local"><button class="primary" onclick="createMarket()">Create Event</button><p id="msg"></p></div><h2>Markets</h2><div id="list" class="grid"></div></main><script>
async function api(url,opt){let r=await fetch(url,opt);let d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function load(){try{let d=await api('/api/markets');document.getElementById('list').innerHTML=d.markets.map(m=>`<article class="market"><span class="tag">${m.status}</span><h3>${m.title}</h3><p>${m.yesPct}% YES · ${m.noPct}% NO</p><div class="sides">${m.status==='open'?`<button class="no" onclick="closeM(${m.id})">Close</button>`:''}${m.status!=='resolved'?`<button class="yes" onclick="resolveM(${m.id},'YES')">Resolve YES</button><button class="no" onclick="resolveM(${m.id},'NO')">Resolve NO</button>`:''}</div></article>`).join('')}catch(e){document.getElementById('msg').textContent=e.message}}
async function createMarket(){try{await api('/api/admin/markets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,description:desc.value,closesAt:new Date(close.value).toISOString()})});msg.textContent='Created';load()}catch(e){msg.textContent=e.message}}
async function closeM(id){try{await api('/api/admin/markets/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'closed'})});load()}catch(e){alert(e.message)}}
async function resolveM(id,result){if(!confirm('Resolve this market as '+result+'?'))return;try{await api('/api/admin/markets/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({result})});load()}catch(e){alert(e.message)}}
load();
</script></body></html>
